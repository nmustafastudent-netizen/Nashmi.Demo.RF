name: Add precise PDF navigation to existing viewer
on:
  push:
    paths:
      - .github/workflows/enable-pdf-routes.yml
permissions:
  contents: write
jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep existing viewer, enable device-specific links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('index.html')
          s=file.read_text(encoding='utf-8')
          marker="if(location.hash==='#vehicle-interior'){go('vehicle');setStage('cabin')}else if(sections.includes(location.hash.slice(1)))go(location.hash.slice(1));"
          addition="""const pdfTarget=location.hash.slice(1);if(['kit-scanner','kit-paired','kit-software'].includes(pdfTarget)){go('kit');const pdfTab=document.querySelector('[data-kit="'+pdfTarget.slice(4)+'"]');if(pdfTab)pdfTab.click();}else """
          if "const pdfTarget=location.hash.slice(1)" not in s:
            assert s.count(marker)==1, 'Original viewer anchor not found'
            s=s.replace(marker,addition+marker,1)
            file.write_text(s,encoding='utf-8')
            print("ADDED_DEEP_LINKS scanner paired software",len(s))
          else:print("Routes already added")
          PY
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Allow portfolio image links to open exact equipment simulations"
            git push origin HEAD:main
          fi
