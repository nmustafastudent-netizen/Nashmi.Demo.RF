name: Diagnose Nashmi RF Portal and DNS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check HTML and linked portal features
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path("index.html").read_text(encoding="utf-8")
          print("HTML_BYTES",len(html))
          print("HTML_TITLE",re.findall(r"<title[^>]*>(.*?)</title>",html,re.I|re.S)[:1])
          print("SCRIPT_COUNT",html.lower().count("<script"))
          print("EVENT_COUNT",html.count("addEventListener("))
          print("IFRAME_COUNT",len(re.findall(r"<iframe",html,re.I)))
          print("INTERACTIVE_SECTION_IDS", re.findall(r'id="([^"]+)"',html)[:100])
          print("ANCHOR_HREFS",re.findall(r'href="([^"]+)"',html)[:55])
          print("HASH_MARKERS", {key:html.count(key) for key in ("location.hash","hashchange","URLSearchParams","data-panel","openModal")})
          print("HTML_SNIPPET",html[:1400].replace("\n"," "))
          print("HTML_END",html[-500:].replace("\n"," "))
          PY
      - name: Diagnose public DNS and website hosting
        shell: bash
        run: |
          for host in nashmigroup.com rf.nashmigroup.com nmustafastudent-netizen.github.io; do
            echo "== DNS $host =="
            dig +short NS "$host"
            dig +short CNAME "$host"
            dig +short A "$host"
          done
          for url in https://rf.nashmigroup.com/ https://nashmigroup.com/ https://nmustafastudent-netizen.github.io/Nashmi.Demo.RF/ https://raw.githack.com/nmustafastudent-netizen/Nashmi.Demo.RF/main/index.html; do
            echo "== HTTP $url =="
            curl --max-time 15 -L -s -o /dev/null -w 'HTTP %{http_code} final=%{url_effective} type=%{content_type} size=%{size_download} error=%{errormsg}\n' "$url" || true
          done
      - name: Check direct HTML fallback hosts and browser
        shell: bash
        run: |
          for url in "https://cdn.jsdelivr.net/gh/nmustafastudent-netizen/Nashmi.Demo.RF@main/index.html" "https://raw.githack.com/nmustafastudent-netizen/Nashmi.Demo.RF/main/index.html" "https://htmlpreview.github.io/?https://raw.githubusercontent.com/nmustafastudent-netizen/Nashmi.Demo.RF/main/index.html"; do
            echo "== ALTERNATE $url =="
            curl -sL --max-time 22 -H 'Sec-Fetch-Dest: document' -o /tmp/alt-web-response -w 'HTTP %{http_code} TYPE %{content_type} SIZE %{size_download} EFFECTIVE %{url_effective}\n' "$url" || true
            head -c 220 /tmp/alt-web-response | tr '\n' ' '; echo
          done
          echo "== CHROME =="; command -v google-chrome || true
          command -v chromium || true
      - name: Open actual viewer and public fallback in headless Chrome
        shell: bash
        run: |
          for url in "file://$PWD/index.html#map" "https://htmlpreview.github.io/?https://raw.githubusercontent.com/nmustafastudent-netizen/Nashmi.Demo.RF/main/index.html" "https://raw.githack.com/nmustafastudent-netizen/Nashmi.Demo.RF/main/index.html"; do
            echo "== BROWSER $url =="
            timeout 40s google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --virtual-time-budget=8500 --dump-dom "$url" > /tmp/chrome-output.html 2>/dev/null || true
            python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/chrome-output.html').read_text(errors='replace')
          print("DOM_CHARS",len(s),"NASHMI_VIEWER", "Nashmi | Private RF Engineering Explorer" in s,"HAS_MAP", 'id="siteMap"' in s,"CONTENT_WARNING","External Content Notice" in s,"HAS_IMAGE", 'data:image/' in s)
          print("FIRST_TITLE",s.split('<title>')[1].split('</title>')[0] if '<title>' in s else "NO_TITLE")
          PY
          done
